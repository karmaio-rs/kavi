[package]
name = "kavi"
description = "Compose beautiful web apps in async rust"
repository.workspace = true
readme = "README.md"
authors.workspace = true
license.workspace = true

version.workspace = true

categories = [
    "web-programming",
    "asynchronous",
    "database",
]
keywords = ["web", "framework", "fullstack", "async", "orm"]

rust-version.workspace = true
edition.workspace = true

[features]
default = []
cookies = ["dep:biscotti"]

[dependencies]
# Core dependencies
kavi-macros = { version = "0.1.0", path = "../kavi-macros" }
karmaio = { version = "0.1", features = ["macros", "net", "bytes", "fs", "signal"] }
regex = { version = "1" }
regex-syntax = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
memchr = { version = "2" }

# HTTP dependencies
biscotti = { version = "0.4.3", optional = true }
bytes = { version = "1.12.1" }
encoding_rs = { version = "0.8" }
http = { version = "1.5.0" }
httparse = { version = "1" }
percent-encoding = {version = "2.3.2" }
serde_qs = { version = "1.1.3" }
vakya = { version = "0.1.0-alpha.1", features = ["client", "server"] }

# Type Dependencies
mime = { version = "0.3" }
thiserror = { version = "2" }

[dev-dependencies]
