[package]
name = "kavi"
description = "Compose beautiful web apps in async rust"
repository.workspace = true
readme = "README.md"
authors.workspace = true
license.workspace = true

version.workspace = true

categories = [
    "web-programming",
    "asynchronous",
    "database",
]
keywords = ["web", "framework", "fullstack", "async", "orm"]

rust-version.workspace = true
edition.workspace = true

[dependencies]
# Core dependencies
karmaio = { version = "0.1", features = ["macros", "net", "bytes", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# HTTP dependencies
http = { version = "1.5.0" }
bytes = { version = "1.12.1" }
serde_qs = { version = "1.1.3" }
vakya = { version = "0.1.0-alpha.1", features = ["client", "server"] }

# Type Dependencies
thiserror = { version = "2" }
mime = "0.3"
biscotti = "0.4.3"
httparse = "1.10"

[dev-dependencies]
